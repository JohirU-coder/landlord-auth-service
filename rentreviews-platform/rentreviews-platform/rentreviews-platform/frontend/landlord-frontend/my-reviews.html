<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Reviews - RentReviews</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="./i18n/i18n-config.js"></script>
    <script src="./config.js"></script>
    <script src="./session-guard.js"></script>

    <style>
        :root {
            --ink: #2b362f;
            --paper: #f7f7f0;
            --paper-raised: #ffffff;
            --forest: #4f8a5b;
            --forest-deep: #3d6e48;
            --brass: #d1a13e;
            --brick: #c15b3f;
            --brick-deep: #a84832;
            --stone: #9c9684;
            --stone-line: #e3e0d3;
            --text-muted: #5c6259;
        }

        body { font-family: 'Public Sans', sans-serif; background-color: var(--paper); }
        h1, h2, h3 { font-family: 'Fraunces', serif; font-weight: 600; letter-spacing: -0.01em; }

        .card { background: var(--paper-raised); border: 1px solid var(--stone-line); border-radius: 3px; }

        .btn-forest { background: var(--forest); color: white; }
        .btn-forest:hover { background: var(--forest-deep); }
        .btn-outline { border: 1px solid var(--stone-line); color: var(--ink); background: var(--paper-raised); }
        .btn-outline:hover { border-color: var(--forest); color: var(--forest-deep); }
        .btn-danger { border: 1px solid var(--stone-line); color: var(--brick); background: var(--paper-raised); }
        .btn-danger:hover { border-color: var(--brick); background: #fdf1ee; }

        .role-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: .7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .03em;
        }
        .role-badge.landlord { background: #fbeed9; color: var(--brass); }
        .role-badge.renter { background: #eaf1ea; color: var(--forest-deep); }
    </style>
</head>
<body class="min-h-screen">

    <!-- Navigation -->
    <nav class="bg-white shadow-sm border-b sticky top-0 z-50" style="border-color: var(--stone-line);">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="./dashboard.html" class="flex-shrink-0 flex items-center hover:opacity-80 transition-opacity">
                        <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background: var(--forest);">
                            <svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 1.5l2.6 6.3 6.8.55-5.2 4.5 1.6 6.65L12 15.9l-5.8 3.6 1.6-6.65-5.2-4.5 6.8-.55L12 1.5z"/></svg>
                        </div>
                        <span class="ml-3 text-xl font-bold" style="color: var(--ink);">RentReviews</span>
                    </a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="./dashboard.html" class="text-sm font-medium px-3 py-2" style="color: var(--text-muted);">Dashboard</a>
                    <a href="./search.html" class="text-sm font-medium px-3 py-2" style="color: var(--text-muted);">Search</a>
                    <button id="logoutBtn" class="px-4 py-2 rounded-lg text-sm font-medium btn-outline">Sign Out</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Header -->
    <div class="py-12" style="background: var(--forest);">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <h1 class="text-4xl font-bold text-white mb-3">My Reviews</h1>
            <p class="text-lg" style="color: #dcece0;">View, edit, or delete the reviews you've written</p>
        </div>
    </div>

    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <div id="loadingState" class="text-center py-16" style="color: var(--text-muted);">Loading your reviews…</div>

        <div id="emptyState" class="hidden text-center py-16">
            <p class="text-xl mb-4" style="color: var(--text-muted);">You haven't written any reviews yet.</p>
            <a href="./search.html" class="inline-block px-6 py-3 rounded-lg font-medium btn-forest">Find a property to review</a>
        </div>

        <div id="reviewsList" class="hidden space-y-6"></div>
    </main>

    <script>
        const API_BASE_URL = (window.APP_CONFIG && window.APP_CONFIG.API_BASE_URL) || 'http://localhost:8080';
        const REVIEW_API_BASE_URL = (window.APP_CONFIG && window.APP_CONFIG.REVIEW_API_BASE_URL) || 'http://localhost:3003';

        const token = localStorage.getItem('rentreviews_token');
        if (!token) {
            window.location.href = './auth.html';
        }

        let currentUserId = null;
        try {
            const cached = JSON.parse(localStorage.getItem('rentreviews_user') || '{}');
            currentUserId = cached.id || null;
        } catch (e) { /* ignore */ }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str == null ? '' : String(str);
            return div.innerHTML;
        }

        function starString(rating) {
            const r = rating || 0;
            return '★'.repeat(r) + '☆'.repeat(5 - r);
        }

        function formatDate(d) {
            return d ? new Date(d).toLocaleDateString() : '';
        }

        async function loadReviews() {
            try {
                const response = await fetch(`${REVIEW_API_BASE_URL}/reviews/my-reviews?limit=50`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                const reviews = data.reviews || [];

                document.getElementById('loadingState').classList.add('hidden');

                if (reviews.length === 0) {
                    document.getElementById('emptyState').classList.remove('hidden');
                    return;
                }

                const listEl = document.getElementById('reviewsList');
                listEl.innerHTML = reviews.map(renderReviewCard).join('');
                listEl.classList.remove('hidden');

                reviews.forEach(wireReviewCard);
            } catch (error) {
                console.error('Error loading reviews:', error);
                document.getElementById('loadingState').textContent = 'Something went wrong loading your reviews. Please try again later.';
            }
        }

        function renderReviewCard(review) {
            const address = [review.property?.address, review.property?.city, review.property?.state].filter(Boolean).join(', ');
            const rating = review.ratings?.overall || 0;

            return `
                <div class="card p-6" data-review-id="${review.id}">
                    <div class="flex items-start justify-between mb-2 gap-4">
                        <div>
                            <h3 class="font-semibold text-lg" style="color: var(--ink);">${escapeHtml(address)}</h3>
                            <p class="text-sm" style="color: var(--text-muted);">${escapeHtml(formatDate(review.created_at))}</p>
                        </div>
                        <div class="text-lg flex-shrink-0" style="color: var(--brass);">${starString(rating)}</div>
                    </div>
                    <p class="font-medium mb-1" style="color: var(--ink);">${escapeHtml(review.title || '')}</p>
                    <p class="mb-4" style="color: var(--text-muted);">${escapeHtml(review.review_text || '')}</p>

                    ${Array.isArray(review.photos) && review.photos.length > 0 ? `
                        <div class="flex gap-2 mb-4">
                            ${review.photos.map(p => `<img src="${REVIEW_API_BASE_URL}${p}" alt="" class="w-20 h-20 object-cover rounded-lg border" style="border-color: var(--stone-line);">`).join('')}
                        </div>
                    ` : ''}

                    ${review.landlord_response ? `
                        <div class="mb-4 ml-4 pl-3 border-l-2 rounded-r-lg p-3" style="border-color: var(--brass); background: #fdf8ee;">
                            <p class="text-xs font-semibold mb-1" style="color: var(--brass);">LANDLORD RESPONSE</p>
                            <p class="text-sm" style="color: var(--ink);">${escapeHtml(review.landlord_response.text || '')}</p>
                        </div>
                    ` : ''}

                    <div class="flex items-center gap-3 mb-3 pt-3 border-t" style="border-color: var(--stone-line);">
                        <button class="edit-btn text-sm font-medium px-4 py-2 rounded-lg btn-outline">Edit</button>
                        <button class="delete-btn text-sm font-medium px-4 py-2 rounded-lg btn-danger">Delete</button>
                        <button class="replies-toggle-btn text-sm font-medium px-3 py-2" style="color: var(--forest-deep);">
                            <span class="replies-count-label">${review.reply_count || 0}</span> ${review.reply_count === 1 ? 'reply' : 'replies'} — view / add
                        </button>
                    </div>

                    <div class="replies-section hidden pt-3 border-t" style="border-color: var(--stone-line);">
                        <div class="replies-list space-y-3 mb-3"></div>
                        <div class="flex gap-2">
                            <input type="text" class="reply-input flex-1 px-3 py-2 border rounded-lg text-sm" style="border-color: var(--stone-line);" placeholder="Write a reply…" maxlength="1000">
                            <button class="reply-submit-btn px-4 py-2 rounded-lg text-sm font-medium btn-forest">Reply</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderReply(reply) {
            const name = `${reply.author?.first_name || ''} ${(reply.author?.last_name || '')[0] || ''}${reply.author?.last_name ? '.' : ''}`.trim() || 'User';
            const role = reply.author?.role === 'landlord' ? 'landlord' : 'renter';
            const canDelete = currentUserId && reply.author?.id === currentUserId;

            return `
                <div class="text-sm p-3 rounded-lg" style="background: var(--paper);" data-reply-id="${reply.id}">
                    <div class="flex items-center justify-between mb-1">
                        <span>
                            <span class="font-medium" style="color: var(--ink);">${escapeHtml(name)}</span>
                            <span class="role-badge ${role} ml-2">${role}</span>
                        </span>
                        ${canDelete ? `<button class="delete-reply-btn text-xs" style="color: var(--brick);">Delete</button>` : ''}
                    </div>
                    <p style="color: var(--text-muted);">${escapeHtml(reply.reply_text)}</p>
                </div>
            `;
        }

        function wireReviewCard(review) {
            const card = document.querySelector(`[data-review-id="${review.id}"]`);
            if (!card) return;

            card.querySelector('.edit-btn').addEventListener('click', () => {
                window.location.href = `./write-review.html?editReviewId=${review.id}`;
            });

            card.querySelector('.delete-btn').addEventListener('click', async () => {
                if (!confirm('Delete this review? This cannot be undone.')) return;
                try {
                    const response = await fetch(`${REVIEW_API_BASE_URL}/reviews/${review.id}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    card.remove();
                    if (!document.querySelector('#reviewsList [data-review-id]')) {
                        document.getElementById('reviewsList').classList.add('hidden');
                        document.getElementById('emptyState').classList.remove('hidden');
                    }
                } catch (error) {
                    console.error('Error deleting review:', error);
                    alert('Failed to delete review. Please try again.');
                }
            });

            const repliesSection = card.querySelector('.replies-section');
            const repliesList = card.querySelector('.replies-list');
            const repliesToggleBtn = card.querySelector('.replies-toggle-btn');
            const repliesCountLabel = card.querySelector('.replies-count-label');
            let repliesLoaded = false;

            async function loadReplies() {
                try {
                    const response = await fetch(`${REVIEW_API_BASE_URL}/reviews/${review.id}/replies`);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const data = await response.json();
                    const replies = data.replies || [];
                    repliesList.innerHTML = replies.length > 0
                        ? replies.map(renderReply).join('')
                        : `<p class="text-sm" style="color: var(--text-muted);">No replies yet.</p>`;
                    repliesCountLabel.textContent = String(replies.length);
                    repliesList.querySelectorAll('.delete-reply-btn').forEach(btn => {
                        btn.addEventListener('click', async () => {
                            const replyEl = btn.closest('[data-reply-id]');
                            const replyId = replyEl.dataset.replyId;
                            if (!confirm('Delete this reply?')) return;
                            try {
                                const delResp = await fetch(`${REVIEW_API_BASE_URL}/reviews/${review.id}/replies/${replyId}`, {
                                    method: 'DELETE',
                                    headers: { 'Authorization': `Bearer ${token}` }
                                });
                                if (!delResp.ok) throw new Error(`HTTP ${delResp.status}`);
                                replyEl.remove();
                                repliesCountLabel.textContent = String(parseInt(repliesCountLabel.textContent) - 1);
                            } catch (error) {
                                console.error('Error deleting reply:', error);
                                alert('Failed to delete reply. Please try again.');
                            }
                        });
                    });
                    repliesLoaded = true;
                } catch (error) {
                    console.error('Error loading replies:', error);
                    repliesList.innerHTML = `<p class="text-sm" style="color: var(--text-muted);">Couldn't load replies.</p>`;
                }
            }

            repliesToggleBtn.addEventListener('click', () => {
                repliesSection.classList.toggle('hidden');
                if (!repliesSection.classList.contains('hidden') && !repliesLoaded) {
                    loadReplies();
                }
            });

            const replyInput = card.querySelector('.reply-input');
            const replySubmitBtn = card.querySelector('.reply-submit-btn');
            replySubmitBtn.addEventListener('click', async () => {
                const text = replyInput.value.trim();
                if (text.length < 2) return;
                replySubmitBtn.disabled = true;
                try {
                    const response = await fetch(`${REVIEW_API_BASE_URL}/reviews/${review.id}/replies`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                        body: JSON.stringify({ reply_text: text })
                    });
                    if (!response.ok) {
                        const err = await response.json().catch(() => ({}));
                        throw new Error(err.message || `HTTP ${response.status}`);
                    }
                    replyInput.value = '';
                    repliesLoaded = false;
                    if (repliesSection.classList.contains('hidden')) repliesSection.classList.remove('hidden');
                    loadReplies();
                } catch (error) {
                    console.error('Error posting reply:', error);
                    alert('Failed to post reply: ' + error.message);
                } finally {
                    replySubmitBtn.disabled = false;
                }
            });
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('rentreviews_token');
            localStorage.removeItem('rentreviews_user');
            window.location.href = './auth.html';
        });

        loadReviews();
    </script>
</body>
</html>
